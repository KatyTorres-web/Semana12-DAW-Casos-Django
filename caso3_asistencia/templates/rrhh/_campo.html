{# Muestra un campo de formulario con su etiqueta, ayuda y errores #}
<div class="mb-3">
  <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">
    {{ campo.label }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}
  </label>
  {{ campo }}
  {% for error in campo.errors %}
    <div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
  {% endfor %}
  {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
</div>
